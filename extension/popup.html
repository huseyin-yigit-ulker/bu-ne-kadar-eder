<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        width: 280px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap { padding: 16px; }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        background: linear-gradient(90deg, #7c3aed, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.sub { margin: 0 0 14px; font-size: 12px; color: #64748b; }
      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(90deg, #7c3aed, #0ea5e9);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 12px; font-size: 12px; min-height: 16px; color: #475569; }
      .err { color: #dc2626; }
      .ok { color: #059669; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Bu Ne Kadar Eder?</h1>
      <p class="sub">Açık olan ilan sayfasındaki ürünü fiyatla.</p>
      <button id="go">Bu Sayfayı Fiyatla 🔎</button>
      <div class="status" id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
